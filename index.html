<script>
        document.addEventListener("DOMContentLoaded", () => {
            
            const REQ_TOPIC = "neel_auth_req";
            const RES_TOPIC = "neel_auth_res";

            const authForm = document.getElementById("authForm");
            const title = document.getElementById("title");
            const subtitle = document.getElementById("subtitle");
            const authButton = document.getElementById("authButton");
            const switchText = document.getElementById("switchText");
            const switchButton = document.getElementById("switchButton");
            const message = document.getElementById("message");

            let isLogin = true;

            switchButton.addEventListener("click", () => {
                isLogin = !isLogin;
                if (isLogin) {
                    title.innerText = "Welcome Back";
                    subtitle.innerText = "Login to your AI Assistant";
                    authButton.innerText = "Login";
                    switchText.innerText = "Don't have an account?";
                    switchButton.innerText = "Sign Up";
                } else {
                    title.innerText = "Create Account";
                    subtitle.innerText = "Create your AI Assistant account";
                    authButton.innerText = "Sign Up";
                    switchText.innerText = "Already have an account?";
                    switchButton.innerText = "Login";
                }
                message.innerText = "";
            });

            authForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                if (!isLogin) {
                    message.innerText = "Sign Up is disabled in this demo.";
                    message.className = "error";
                    return;
                }

                message.innerText = "Verifying instantly...";
                message.className = "info";
                authButton.disabled = true;

                const reqId = Math.floor(Math.random() * 100000);

                try {
                    // 1. Send the instant request to the bridge
                    await fetch(`https://ntfy.sh/${REQ_TOPIC}`, {
                        method: 'POST',
                        body: `REQ:${reqId}:${email}:${password}`
                    });

                    // 2. Poll for the Python script's response
                    let attempts = 0;
                    const interval = setInterval(async () => {
                        attempts++;
                        if (attempts > 10) { 
                            clearInterval(interval);
                            message.innerText = "Timeout. Is Python running?";
                            message.className = "error";
                            authButton.disabled = false;
                            return;
                        }

                        // Grab the latest responses from the bridge
                        const response = await fetch(`https://ntfy.sh/${RES_TOPIC}/json?poll=1`); 
                        const textData = await response.text();
                        
                        // Parse the stream format
                        const lines = textData.trim().split('\n');
                        for (let i = lines.length - 1; i >= 0; i--) {
                            if (!lines[i]) continue;
                            const data = JSON.parse(lines[i]);
                            
                            if (data.event === "message") {
                                const text = data.message || "";
                                
                                if (text === `RES:${reqId}:SUCCESS`) {
                                    clearInterval(interval);
                                    message.innerText = "Login successful!";
                                    message.className = "success";
                                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
                                    return;
                                } else if (text === `RES:${reqId}:FAILED`) {
                                    clearInterval(interval);
                                    message.innerText = "Invalid Email or Password.";
                                    message.className = "error";
                                    authButton.disabled = false;
                                    return;
                                }
                            }
                        }
                    }, 1000);

                } catch (error) {
                    console.error(error);
                    message.innerText = "Network Error.";
                    message.className = "error";
                    authButton.disabled = false;
                }
            });
            
        });
    </script>
